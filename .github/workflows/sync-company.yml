name: Sync Team Development to Company

on:
  push:
    branches:
      - development

permissions:
  contents: write

jobs:
  sync-company:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Team Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Show Git Remotes
        run: |
          git remote -v

      - name: Push Development Branch to Company
        env:
          TOKEN: ${{ secrets.COMPANY_PAT }}
        run: |
          git push https://x-access-token:${TOKEN}@github.com/AnushkaTakawale/DevOps-Task6-Company-Practice.git development:development